name: 构建 Birdtray（上游源码）

on:
  schedule:
    # UTC 0:00 = 北京时间每天早上 8:00，自动检测上游是否有新版本
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: '要构建的上游分支/标签/提交（默认：自动取上游最新版本 tag）'
        required: false
      upstream_repo:
        description: '要构建的上游仓库 URL（默认：https://github.com/gyunaev/birdtray.git）'
        required: false
      debug:
        description: '是否输出额外调试信息（true 或 false）'
        required: false
      force_build:
        description: '跳过版本检测强制构建（true 或 false）'
        required: false

env:
  DEFAULT_UPSTREAM_REPO: 'https://github.com/gyunaev/birdtray.git'

permissions:
  contents: write # 创建 Release 和 tag 需要

jobs:
  check:
    name: 检测上游版本
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.detect.outputs.version }}
      upstream_repo: ${{ steps.detect.outputs.upstream_repo }}
      upstream_ref: ${{ steps.detect.outputs.upstream_ref }}
      debug: ${{ steps.detect.outputs.debug }}
      should_build: ${{ steps.detect.outputs.should_build }}

    steps:
      - name: 检出本仓库
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: 检测上游最新版本并与已发布版本比对
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          UPSTREAM_REPO="${{ github.event.inputs.upstream_repo || env.DEFAULT_UPSTREAM_REPO }}"
          MANUAL_REF="${{ github.event.inputs.upstream_ref || '' }}"
          FORCE_BUILD="${{ github.event.inputs.force_build || 'false' }}"
          DEBUG="${{ github.event.inputs.debug || 'false' }}"

          echo "上游仓库：$UPSTREAM_REPO"

          # 取上游最新的版本 tag（按版本号降序排，过滤掉非版本号 tag）
          LATEST_TAG=$(git ls-remote --tags --sort=-v:refname "$UPSTREAM_REPO" \
            | awk -F'/' '/refs\/tags\// && !/\^\{\}$/{print $3}' \
            | grep -E '^[vV]?[0-9]+(\.[0-9]+)+$' \
            | head -n1 || true)

          # 手动指定了上游 ref 时，优先使用它（若它是 tag 就作为版本号）
          if [ -n "$MANUAL_REF" ]; then
            echo "手动指定了上游 ref：$MANUAL_REF，跳过版本比对直接构建"
            UPSTREAM_REF="$MANUAL_REF"
            VERSION="$MANUAL_REF"
            # 若手动 ref 不是版本号 tag，用「ref-短提交」作为版本标记，避免 Release 重名
            if ! echo "$VERSION" | grep -qE '^[vV]?[0-9]+(\.[0-9]+)+$'; then
              REF_SHA=$(git ls-remote "$UPSTREAM_REPO" "$MANUAL_REF" refs/heads/* | awk '{print substr($1,1,7); exit}')
              VERSION="${MANUAL_REF}-${REF_SHA:-manual}"
            fi
            SHOULD_BUILD="true"
          elif [ "$FORCE_BUILD" = "true" ]; then
            echo "强制构建模式，跳过版本比对"
            UPSTREAM_REF="${LATEST_TAG:-}"
            VERSION="${LATEST_TAG:-manual-$(date +%Y%m%d)}"
            SHOULD_BUILD="true"
          elif [ -n "$LATEST_TAG" ]; then
            echo "上游最新版本 tag：$LATEST_TAG"
            UPSTREAM_REF="$LATEST_TAG"
            VERSION="$LATEST_TAG"

            # 与本仓库已有 Release 比对：该版本已发布过则跳过构建
            if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "本仓库已存在 $VERSION 的 Release，无需重新构建。"
              SHOULD_BUILD="false"
            else
              echo "检测到新版本 $VERSION（本仓库尚无对应 Release），开始构建。"
              SHOULD_BUILD="true"
            fi
          else
            # 上游没有任何版本号 tag：回退用默认分支最新提交做版本标记
            DEFAULT_BRANCH=$(git ls-remote --symref "$UPSTREAM_REPO" HEAD \
              | awk '/^ref: refs\/heads\//{sub("refs/heads/", "", $2); print $2; exit}')
            UPSTREAM_REF="${DEFAULT_BRANCH:-master}"
            REF_SHA=$(git ls-remote "$UPSTREAM_REPO" "$UPSTREAM_REF" HEAD | awk '{print substr($1,1,7); exit}')
            VERSION="${UPSTREAM_REF}-${REF_SHA:-$(date +%Y%m%d)}"
            echo "上游未找到版本号 tag，回退构建默认分支，版本标记：$VERSION"
            if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "本仓库已存在 $VERSION 的 Release，无需重新构建。"
              SHOULD_BUILD="false"
            else
              SHOULD_BUILD="true"
            fi
          fi

          echo "version=$VERSION"            >> "$GITHUB_OUTPUT"
          echo "upstream_repo=$UPSTREAM_REPO" >> "$GITHUB_OUTPUT"
          echo "upstream_ref=$UPSTREAM_REF"   >> "$GITHUB_OUTPUT"
          echo "debug=$DEBUG"                 >> "$GITHUB_OUTPUT"
          echo "should_build=$SHOULD_BUILD"   >> "$GITHUB_OUTPUT"

      - name: 检测结果
        shell: bash
        run: |
          echo "版本：${{ steps.detect.outputs.version }}"
          echo "上游 ref：${{ steps.detect.outputs.upstream_ref }}"
          echo "是否构建：${{ steps.detect.outputs.should_build }}"

  build:
    name: 构建
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: windows-latest
    strategy:
      matrix:
        qt_version: [6.8.0]
        qt_compile_suite: [win64_msvc2022_64]

    steps:
      - name: 检出本仓库（workflow 与可选 overrides）
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: 安装 Qt ${{ matrix.qt_version }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt_version }}
          arch: ${{ matrix.qt_compile_suite }}
          cache: true
          dir: ${{ runner.temp }}/Qt

      - name: 安装附加依赖
        shell: bash
        run: |
          choco install -y --force openssl.light --version=1.1.1
          echo "C:\Program Files\OpenSSL" >> $GITHUB_PATH

      - name: 克隆上游源码（gyunaev/birdtray，带回退）
        shell: bash
        run: |
          set -euo pipefail
          UPSTREAM_REPO="${{ needs.check.outputs.upstream_repo }}"
          UPSTREAM_REF="${{ needs.check.outputs.upstream_ref }}"
          DEBUG="${{ needs.check.outputs.debug }}"
          echo "请求的上游：$UPSTREAM_REPO @$UPSTREAM_REF"

          REF_TO_CLONE=""
          if [ -n "$UPSTREAM_REF" ] && \
             (git ls-remote --exit-code --heads "$UPSTREAM_REPO" "$UPSTREAM_REF" >/dev/null 2>&1 || \
              git ls-remote --exit-code --tags "$UPSTREAM_REPO" "$UPSTREAM_REF" >/dev/null 2>&1); then
            REF_TO_CLONE="$UPSTREAM_REF"
            echo "所请求的 ref 在远端存在：$REF_TO_CLONE"
          else
            DEFAULT_BRANCH=$(git ls-remote --symref "$UPSTREAM_REPO" HEAD 2>/dev/null | awk '/^ref: refs\/heads\//{print $2}' | sed 's@refs/heads/@@' | head -n1 || true)
            if [ -n "$DEFAULT_BRANCH" ]; then
              echo "未找到所请求的 ref '$UPSTREAM_REF'，回退到远端默认分支 '$DEFAULT_BRANCH'"
              REF_TO_CLONE="$DEFAULT_BRANCH"
            else
              echo "未找到所请求的 ref '$UPSTREAM_REF'，也无法确定远端默认分支，回退到 'master'"
              REF_TO_CLONE="master"
            fi
          fi

          echo "resolved_upstream_ref=$REF_TO_CLONE" >> $GITHUB_OUTPUT
          mkdir -p "${{ runner.workspace }}/upstream"

          if git clone --depth 1 --branch "$REF_TO_CLONE" "$UPSTREAM_REPO" "${{ runner.workspace }}/upstream"; then
            echo "$REF_TO_CLONE 浅克隆成功"
          else
            echo "浅克隆失败，改为完整克隆并检出"
            rm -rf "${{ runner.workspace }}/upstream"
            git clone "$UPSTREAM_REPO" "${{ runner.workspace }}/upstream"
            cd "${{ runner.workspace }}/upstream"
            git fetch --all --tags --prune
            if git rev-parse --verify --quiet "refs/heads/$UPSTREAM_REF" >/dev/null 2>&1 || git rev-parse --verify --quiet "$UPSTREAM_REF" >/dev/null 2>&1; then
              git checkout "$UPSTREAM_REF" || true
            else
              git checkout "$REF_TO_CLONE" || true
            fi
          fi

      - name: 应用本地覆盖文件（可选）
        shell: bash
        run: |
          set -e
          if [ -d "${{ github.workspace }}/overrides" ]; then
            echo "正在把本仓库的 overrides 应用到上游…"
            cp -a "${{ github.workspace }}/overrides/." "${{ runner.workspace }}/upstream/" || true
          else
            echo "仓库中没有 overrides/ 目录，跳过覆盖步骤。"
          fi

      - name: 显示 CMake 版本
        shell: bash
        run: cmake --version

      - name: 配置 CMake（使用上游源码，禁用测试）
        shell: bash
        run: |
          set -e
          cmake -S "${{ runner.workspace }}/upstream" -B "${{ runner.workspace }}/build" \
            -DCMAKE_BUILD_TYPE=Release -DCOMPILER_WARNINGS_AS_ERRORS=ON -DBUILD_WITH_TESTS=OFF \
            -DDONT_EXECUTE_INSTALLER=ON -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: 构建（带守护与详细日志）
        shell: bash
        run: |
          set -euo pipefail
          BUILD_DIR="${{ runner.workspace }}/build"
          if [ ! -d "$BUILD_DIR" ]; then
            echo "未找到构建目录，终止构建步骤。"
            exit 1
          fi
          cd "$BUILD_DIR"

          echo "正在构建 birdtray（单次调用 cmake --build）…"
          if ! cmake --build . --config Release --target birdtray; then
            echo "构建失败，正在转储诊断信息…"
            echo "构建目录顶层列表："
            ls -la . || true
            echo "Release 目录列表："
            ls -la Release || true
            find . -type f \( -iname "*.log" -o -iname "*.out" -o -iname "*.txt" \) -maxdepth 4 -print | while read f; do
              echo "---- $f 输出末尾 ----"
              tail -n 200 "$f" || true
            done
            if [ -f CMakeFiles/CMakeOutput.log ]; then
              echo "---- CMakeOutput.log ----"
              tail -n 200 CMakeFiles/CMakeOutput.log || true
            fi
            exit 1
          fi

          echo "构建成功。列出 Release 目录："
          ls -la Release || true

      - name: 使用 windeployqt 打包 Qt 运行时（Windows）
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d "${{ runner.workspace }}/build" ]; then
            echo "未找到构建目录，跳过 windeployqt。"
            exit 0
          fi
          mkdir -p "${{ runner.workspace }}/dist"
          WINDEPLOYQT=$(command -v windeployqt || true)
          if [ -z "$WINDEPLOYQT" ]; then
            WINDEPLOYQT=$(find "${RUNNER_TEMP}/Qt" -type f -name windeployqt.exe | head -n1 || true)
          fi
          if [ -z "$WINDEPLOYQT" ]; then
            echo "未找到 windeployqt，请确认 Qt bin 在 PATH 中，或调整 install-qt-action 的 'dir' 设置"
            exit 1
          fi
          echo "使用的 windeployqt：$WINDEPLOYQT"
          "$WINDEPLOYQT" --release --dir "${{ runner.workspace }}/dist" "${{ runner.workspace }}/build/Release/birdtray.exe" || true

      - name: 整理 dist 产物（移动 birdtray.exe 并收集翻译文件）
        if: always()
        working-directory: ${{ runner.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          echo "正在整理 dist 产物…"
          mkdir -p "${{ runner.workspace }}/dist"
          mkdir -p "${{ runner.workspace }}/dist/translations"

          BIN_PATH="${{ runner.workspace }}/dist/bin/birdtray.exe"
          ROOT_PATH="${{ runner.workspace }}/dist/birdtray.exe"

          if [ -f "$BIN_PATH" ]; then
            echo "正在移动 $BIN_PATH -> $ROOT_PATH"
            mv -f "$BIN_PATH" "$ROOT_PATH" || true
            rmdir "${{ runner.workspace }}/dist/bin" 2>/dev/null || rm -rf "${{ runner.workspace }}/dist/bin" || true
          elif [ -f "$ROOT_PATH" ]; then
            echo "birdtray.exe 已位于 $ROOT_PATH"
          else
            echo "正在工作区中查找 birdtray 可执行文件…"
            FOUND=$(find "${{ runner.workspace }}" -type f -iname 'birdtray.exe' | head -n 1 || true)
            if [ -n "$FOUND" ]; then
              echo "找到：$FOUND -> 正在移动到 $ROOT_PATH"
              mv -f "$FOUND" "$ROOT_PATH" || true
              DIRNAME=$(dirname "$FOUND")
              rmdir "$DIRNAME" 2>/dev/null || true
            else
              echo "未找到 birdtray.exe，请检查构建/windeployqt/安装步骤的输出。"
            fi
          fi

          cp -r "${{ runner.workspace }}/upstream/src/res/translations/"* "${{ runner.workspace }}/dist/translations/" 2>/dev/null || true
          cp -r "${{ runner.workspace }}/upstream/src/res/locales/"* "${{ runner.workspace }}/dist/translations/" 2>/dev/null || true
          cp -r "${{ runner.workspace }}/upstream/po/"* "${{ runner.workspace }}/dist/translations/" 2>/dev/null || true
          cp -r "${{ runner.workspace }}/build/translations/"* "${{ runner.workspace }}/dist/translations/" 2>/dev/null || true

          echo "整理后的 dist 内容："
          ls -la "${{ runner.workspace }}/dist" || true
          ls -la "${{ runner.workspace }}/dist/translations" || true

      - name: 打包 zip（文件名带版本号）
        if: success()
        shell: pwsh
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $zipName = "Birdtray-$env:VERSION-Windows-x64.zip"
          $zipPath = Join-Path $env:RUNNER_WORKSPACE $zipName
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          Compress-Archive -Path (Join-Path $env:RUNNER_WORKSPACE 'dist/*') -DestinationPath $zipPath -Force
          "ZIP_PATH=$zipPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ZIP_NAME=$zipName" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "已打包：$zipPath"

      - name: 打印构建与工作区布局（可选，debug 时）
        if: ${{ always() && (needs.check.outputs.debug == 'true') }}
        shell: bash
        run: |
          echo "runner 工作区：${{ runner.workspace }}"
          echo "GitHub 工作区：${{ github.workspace }}"
          find "${{ runner.workspace }}" -maxdepth 3 -type d -print || true
          echo "build/Release 目录列表："
          ls -la "${{ runner.workspace }}/build" || true
          ls -la "${{ runner.workspace }}/build/Release" || true
          echo "dist 目录列表："
          ls -la "${{ runner.workspace }}/dist" || true

      - name: 上传构建产物
        if: always()
        uses: actions/upload-artifact@v7
        env:
          VERSION: ${{ needs.check.outputs.version }}
        with:
          name: birdtray-${{ runner.os }}-${{ needs.check.outputs.version }}
          path: |
            ${{ runner.workspace }}/dist/**
            ${{ runner.workspace }}/dist/translations/**
            ${{ runner.workspace }}/build/**/*.exe
            ${{ runner.workspace }}/build/**/*.dll
            ${{ runner.workspace }}/upstream/src/res/**/locales/**
            ${{ runner.workspace }}/upstream/src/res/**/translations/**

      - name: 创建 GitHub Release 并上传安装包
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.check.outputs.version }}"
          ZIP_PATH="${{ env.ZIP_PATH }}"
          ZIP_NAME="${{ env.ZIP_NAME }}"

          if [ ! -f "$ZIP_PATH" ]; then
            echo "未找到打包文件 $ZIP_PATH，跳过 Release 发布。"
            exit 1
          fi

          # 幂等保护：若 Release 已存在（例如手动重跑），只补传文件
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $VERSION 已存在，尝试补充上传文件…"
            gh release upload "$VERSION" "$ZIP_PATH" --repo "$GITHUB_REPOSITORY" --clobber
          else
            UPSTREAM_URL="${{ needs.check.outputs.upstream_repo }}"
            gh release create "$VERSION" "$ZIP_PATH" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Birdtray $VERSION" \
              --notes "自动构建自上游 [$UPSTREAM_URL]($UPSTREAM_URL) 的 $VERSION 版本。

          - 平台：Windows x64
          - 内容：birdtray.exe + Qt 运行时 + 翻译文件
          - 构建时间：$(date -u '+%Y-%m-%d %H:%M UTC')"
          fi

          echo "Release $VERSION 发布完成。"
