name: 构建 Birdtray（上游源码）

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: '要构建的上游分支/标签/提交（默认：main）'
        required: false
      upstream_repo:
        description: '要构建的上游仓库 URL（默认：https://github.com/gyunaev/birdtray.git）'
        required: false
      debug:
        description: '是否输出额外调试信息（true 或 false）'
        required: false

env:
  DEFAULT_UPSTREAM_REPO: 'https://github.com/gyunaev/birdtray.git'
  DEFAULT_UPSTREAM_REF: 'main'

jobs:
  build:
    name: 构建
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest]
        qt_version: [6.8.0]
        include:
          - os: windows-latest
            qt_compile_suite: win64_msvc2022_64

    steps:
      - name: 检出本仓库（workflow 与可选 overrides）
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: 确定上游仓库与 ref
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          UPSTREAM_REPO="${{ github.event.inputs.upstream_repo || env.DEFAULT_UPSTREAM_REPO }}"
          UPSTREAM_REF="${{ github.event.inputs.upstream_ref || env.DEFAULT_UPSTREAM_REF }}"
          DEBUG="${{ github.event.inputs.debug || 'false' }}"
          echo "upstream_repo=$UPSTREAM_REPO" >> $GITHUB_OUTPUT
          echo "upstream_ref=$UPSTREAM_REF" >> $GITHUB_OUTPUT
          echo "debug=$DEBUG" >> $GITHUB_OUTPUT

      - name: 安装 Qt ${{ matrix.qt_version }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt_version }}
          arch: ${{ matrix.qt_compile_suite }}
          cache: true
          dir: ${{ runner.temp }}/Qt

      - name: 安装附加依赖
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            sudo apt-get update -qq
            sudo apt install -qq libx11-dev libx11-xcb-dev desktop-file-utils appstream-util
          elif [ "$RUNNER_OS" == "Windows" ]; then
            choco install -y --force openssl.light --version=1.1.1
            echo "C:\Program Files\OpenSSL" >> $GITHUB_PATH
          else
            echo "$RUNNER_OS 不受支持"
            exit 1
          fi

      - name: 克隆上游源码（gyunaev/birdtray，带回退）
        shell: bash
        run: |
          set -euo pipefail
          UPSTREAM_REPO="${{ steps.upstream.outputs.upstream_repo }}"
          UPSTREAM_REF="${{ steps.upstream.outputs.upstream_ref }}"
          echo "请求的上游：$UPSTREAM_REPO @$UPSTREAM_REF"

          REF_TO_CLONE=""
          if git ls-remote --exit-code --heads "$UPSTREAM_REPO" "$UPSTREAM_REF" >/dev/null 2>&1 || \
             git ls-remote --exit-code --tags "$UPSTREAM_REPO" "$UPSTREAM_REF" >/dev/null 2>&1; then
            REF_TO_CLONE="$UPSTREAM_REF"
            echo "所请求的 ref 在远端存在：$REF_TO_CLONE"
          else
            DEFAULT_BRANCH=$(git ls-remote --symref "$UPSTREAM_REPO" HEAD 2>/dev/null | awk '/^ref: refs\/heads\//{print $2}' | sed 's@refs/heads/@@' | head -n1 || true)
            if [ -n "$DEFAULT_BRANCH" ]; then
              echo "未找到所请求的 ref '$UPSTREAM_REF'，回退到远端默认分支 '$DEFAULT_BRANCH'"
              REF_TO_CLONE="$DEFAULT_BRANCH"
            else
              echo "未找到所请求的 ref '$UPSTREAM_REF'，也无法确定远端默认分支，回退到 'master'"
              REF_TO_CLONE="master"
            fi
          fi

          echo "resolved_upstream_ref=$REF_TO_CLONE" >> $GITHUB_OUTPUT
          mkdir -p "${{ runner.workspace }}/upstream"

          if git clone --depth 1 --branch "$REF_TO_CLONE" "$UPSTREAM_REPO" "${{ runner.workspace }}/upstream"; then
            echo "$REF_TO_CLONE 浅克隆成功"
          else
            echo "浅克隆失败，改为完整克隆并检出"
            rm -rf "${{ runner.workspace }}/upstream"
            git clone "$UPSTREAM_REPO" "${{ runner.workspace }}/upstream"
            cd "${{ runner.workspace }}/upstream"
            git fetch --all --tags --prune
            if git rev-parse --verify --quiet "refs/heads/$UPSTREAM_REF" >/dev/null 2>&1 || git rev-parse --verify --quiet "$UPSTREAM_REF" >/dev/null 2>&1; then
              git checkout "$UPSTREAM_REF" || true
            else
              git checkout "$REF_TO_CLONE" || true
            fi
          fi

      - name: 应用本地覆盖文件（可选）
        shell: bash
        run: |
          set -e
          if [ -d "${{ github.workspace }}/overrides" ]; then
            echo "正在把本仓库的 overrides 应用到上游…"
            cp -a "${{ github.workspace }}/overrides/." "${{ runner.workspace }}/upstream/" || true
          else
            echo "仓库中没有 overrides/ 目录，跳过覆盖步骤。"
          fi

      - name: 校验上游元数据中包含该版本号（仅发布构建）
        if: github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags/v')
        env:
          EVENT_REF: ${{ github.event.ref }}
          UPSTREAM_DIR: ${{ runner.workspace }}/upstream
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${EVENT_REF#refs/tags/}"
          VERSION="${VERSION#v}"
          APPDATA="${UPSTREAM_DIR}/src/res/com.ulduzsoft.Birdtray.appdata.xml"
          if [ ! -f "$APPDATA" ]; then
            echo "未找到上游元数据文件：$APPDATA"
            exit 1
          fi
          if ! grep -q "version=\"${VERSION}\"" "$APPDATA"; then
            echo "上游 $APPDATA 中没有 version=\"${VERSION}\" 的记录（tag 为 ${EVENT_REF}）"
            exit 1
          fi
          echo "上游元数据已包含版本号 ${VERSION}"

      - name: 创建构建目录
        shell: bash
        run: |
          set -e
          cmake -E make_directory "${{ runner.workspace }}/build"

      - name: 显示 CMake 版本
        shell: bash
        run: cmake --version

      - name: 配置 CMake（使用上游源码，禁用测试）
        shell: bash
        run: |
          set -e
          cmake -S "${{ runner.workspace }}/upstream" -B "${{ runner.workspace }}/build" \
            -DCMAKE_BUILD_TYPE=Release -DCOMPILER_WARNINGS_AS_ERRORS=ON -DBUILD_WITH_TESTS=OFF \
            -DDONT_EXECUTE_INSTALLER=ON -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: 注册构建问题匹配器（安全）
        shell: bash
        run: |
          set -euo pipefail
          for matcher in .github/problem-matchers/linguist.json .github/problem-matchers/compiler.json; do
            if [ -f "$matcher" ]; then
              echo "正在添加匹配器：$matcher"
              echo "::add-matcher::$matcher"
            else
              echo "未找到匹配器，跳过：$matcher"
            fi
          done

      - name: 构建（带守护与详细日志）
        shell: bash
        run: |
          set -euo pipefail
          BUILD_DIR="${{ runner.workspace }}/build"
          if [ ! -d "$BUILD_DIR" ]; then
            echo "未找到构建目录，终止构建步骤。"
            exit 1
          fi
          cd "$BUILD_DIR"

          echo "正在构建 birdtray（单次调用 cmake --build）…"
          if ! cmake --build . --config Release --target birdtray; then
            echo "构建失败，正在转储诊断信息…"
            echo "构建目录顶层列表："
            ls -la . || true
            echo "Release 目录列表："
            ls -la Release || true
            find . -type f \( -iname "*.log" -o -iname "*.out" -o -iname "*.txt" \) -maxdepth 4 -print | while read f; do
              echo "---- $f 输出末尾 ----"
              tail -n 200 "$f" || true
            done
            if [ -f CMakeFiles/CMakeOutput.log ]; then
              echo "---- CMakeOutput.log ----"
              tail -n 200 CMakeFiles/CMakeOutput.log || true
            fi
            exit 1
          fi

          echo "构建成功。列出 Release 目录："
          ls -la Release || true

      - name: 移除构建问题匹配器
        shell: bash
        run: |
          echo "::remove-matcher owner=linguist::"
          echo "::remove-matcher owner=linguist-old::"
          echo "::remove-matcher owner=compiler-gcc::"
          echo "::remove-matcher owner=compiler-msvc::"

      - name: 运行测试（仅当存在测试工程时）
        shell: bash
        run: |
          set -euo pipefail
          BUILD_DIR="${{ runner.workspace }}/build"
          if [ ! -d "$BUILD_DIR" ]; then
            echo "未找到构建目录，跳过测试。"
            exit 0
          fi
          # Look for a tests.vcxproj (Visual Studio generator) as an indicator
          TEST_PROJECT=$(find "$BUILD_DIR" -maxdepth 2 -type f -iname 'tests.vcxproj' -print -quit || true)
          if [ -z "$TEST_PROJECT" ]; then
            echo "未找到测试工程，跳过测试。"
            exit 0
          fi
          echo "找到测试工程：$TEST_PROJECT"
          cd "$BUILD_DIR"
          cmake --build . --config Release --target tests && cmake --build . --config Release --target run_tests

      - name: 判断是否为发布构建
        id: check-deploy
        shell: bash
        run: |
          if [[ '${{ github.event.ref }}' =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ && "$RUNNER_OS" == "Windows" ]]; then
            echo "is_deploy=true" >> $GITHUB_OUTPUT
          else
            echo "is_deploy=false" >> $GITHUB_OUTPUT
          fi

      - name: 使用 windeployqt 打包 Qt 运行时（Windows）
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d "${{ runner.workspace }}/build" ]; then
            echo "未找到构建目录，跳过 windeployqt。"
            exit 0
          fi
          mkdir -p "${{ runner.workspace }}/dist"
          WINDEPLOYQT=$(command -v windeployqt || true)
          if [ -z "$WINDEPLOYQT" ]; then
            WINDEPLOYQT=$(find "${RUNNER_TEMP}/Qt" -type f -name windeployqt.exe | head -n1 || true)
          fi
          if [ -z "$WINDEPLOYQT" ]; then
            echo "未找到 windeployqt，请确认 Qt bin 在 PATH 中，或调整 install-qt-action 的 'dir' 设置"
            exit 1
          fi
          echo "使用的 windeployqt：$WINDEPLOYQT"
          "$WINDEPLOYQT" --release --dir "${{ runner.workspace }}/dist" "${{ runner.workspace }}/build/Release/birdtray.exe" || true

      - name: 安装到暂存目录（cmake --install，仅发布构建）
        if: steps.check-deploy.outputs.is_deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          BUILD_DIR="${{ runner.workspace }}/build"
          EXE_PATH="${BUILD_DIR}/Release/birdtray.exe"
          if [ ! -d "$BUILD_DIR" ]; then
            echo "未找到构建目录，跳过 cmake --install。"
            exit 1
          fi
          if [ ! -f "$EXE_PATH" ]; then
            echo "错误：未在预期路径找到 birdtray.exe：$EXE_PATH"
            echo "构建目录列表："
            ls -la "$BUILD_DIR" || true
            echo "Release 目录列表："
            ls -la "${BUILD_DIR}/Release" || true
            if [ -f "${BUILD_DIR}/CMakeFiles/CMakeOutput.log" ]; then
              echo "---- CMakeOutput.log ----"
              tail -n 200 "${BUILD_DIR}/CMakeFiles/CMakeOutput.log" || true
            fi
            exit 1
          fi
          cd "$BUILD_DIR"
          cmake --install . --config Release --prefix "${{ runner.workspace }}/dist" || true

      - name: 整理 dist 产物（移动 birdtray.exe 并收集翻译文件）
        if: always()
        working-directory: ${{ runner.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          echo "正在整理 dist 产物…"
          mkdir -p "${{ runner.workspace }}/dist"
          mkdir -p "${{ runner.workspace }}/dist/translations"

          BIN_PATH="${{ runner.workspace }}/dist/bin/birdtray.exe"
          ROOT_PATH="${{ runner.workspace }}/dist/birdtray.exe"

          if [ -f "$BIN_PATH" ]; then
            echo "正在移动 $BIN_PATH -> $ROOT_PATH"
            mv -f "$BIN_PATH" "$ROOT_PATH" || true
            rmdir "${{ runner.workspace }}/dist/bin" 2>/dev/null || rm -rf "${{ runner.workspace }}/dist/bin" || true
          elif [ -f "$ROOT_PATH" ]; then
            echo "birdtray.exe 已位于 $ROOT_PATH"
          else
            echo "正在工作区中查找 birdtray 可执行文件…"
            FOUND=$(find "${{ runner.workspace }}" -type f -iname 'birdtray.exe' | head -n 1 || true)
            if [ -n "$FOUND" ]; then
              echo "找到：$FOUND -> 正在移动到 $ROOT_PATH"
              mv -f "$FOUND" "$ROOT_PATH" || true
              DIRNAME=$(dirname "$FOUND")
              rmdir "$DIRNAME" 2>/dev/null || true
            else
              echo "未找到 birdtray.exe，请检查构建/windeployqt/安装步骤的输出。"
            fi
          fi

          cp -r "${{ runner.workspace }}/upstream/src/res/translations/"* "${{ runner.workspace }}/dist/translations/" 2>/dev/null || true
          cp -r "${{ runner.workspace }}/upstream/src/res/locales/"* "${{ runner.workspace }}/dist/translations/" 2>/dev/null || true
          cp -r "${{ runner.workspace }}/upstream/po/"* "${{ runner.workspace }}/dist/translations/" 2>/dev/null || true
          cp -r "${{ runner.workspace }}/build/translations/"* "${{ runner.workspace }}/dist/translations/" 2>/dev/null || true

          echo "整理后的 dist 内容："
          ls -la "${{ runner.workspace }}/dist" || true
          ls -la "${{ runner.workspace }}/dist/translations" || true

      - name: 打印构建与工作区布局（可选，debug 时）
        if: ${{ always() && (steps.upstream.outputs.debug == 'true') }}
        shell: bash
        run: |
          echo "runner 工作区：${{ runner.workspace }}"
          echo "GitHub 工作区：${{ github.workspace }}"
          find "${{ runner.workspace }}" -maxdepth 3 -type d -print || true
          echo "build/Release 目录列表："
          ls -la "${{ runner.workspace }}/build" || true
          ls -la "${{ runner.workspace }}/build/Release" || true
          echo "dist 目录列表："
          ls -la "${{ runner.workspace }}/dist" || true

      - name: 上传构建产物
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: birdtray-${{ runner.os }}-${{ github.sha }}
          path: |
            ${{ runner.workspace }}/dist/**
            ${{ runner.workspace }}/dist/translations/**
            ${{ runner.workspace }}/build/**/*.exe
            ${{ runner.workspace }}/build/**/*.dll
            ${{ runner.workspace }}/upstream/src/res/**/locales/**
            ${{ runner.workspace }}/upstream/src/res/**/translations/**

      - name: 清理 build 目录（非发布构建）
        if: ${{ always() && !(github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags/v')) }}
        shell: bash
        run: |
          echo "非发布构建：正在删除 build 目录以释放空间…"
          rm -rf "${{ runner.workspace }}/build" || true
          echo "清理后 runner 工作区根目录："
          ls -la "${{ runner.workspace }}" || true

      - name: 校验 desktop 文件与应用元数据（仅 Linux）
        working-directory: ${{ runner.workspace }}/upstream
        if: runner.os == 'Linux'
        shell: bash
        run: |
          output=$(desktop-file-validate src/res/com.ulduzsoft.Birdtray.desktop)
          if [ ! -z "$output" ]; then
            echo "$output"
            exit 1
          fi
          appstream-util validate src/res/com.ulduzsoft.Birdtray.appdata.xml

      - name: 安装生成安装器所需依赖（仅发布构建）
        if: steps.check-deploy.outputs.is_deploy == 'true'
        run: choco install -y nsis --version=3.11

      - name: 生成安装器（仅发布构建）
        if: steps.check-deploy.outputs.is_deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d "${{ runner.workspace }}/build" ]; then
            echo "未找到构建目录，跳过生成安装器。"
            exit 1
          fi
          cd "${{ runner.workspace }}/build"
          cmake --build . --config Release --target install

      - name: 查找安装器文件（仅发布构建）
        if: steps.check-deploy.outputs.is_deploy == 'true'
        id: find_installer_file
        working-directory: ${{ runner.workspace }}/upstream
        shell: bash
        run: |
          set -euo pipefail
          installerFile=$(find installer -maxdepth 1 -name "Birdtray-*.exe" -printf '%f\n' -quit 2>/dev/null || true)
          if [ -z "$installerFile" ]; then
            echo "未在 installer/ 下找到 Birdtray-*.exe，安装器可能没有生成成功"
            ls -la installer || true
            exit 1
          fi
          echo "找到安装器：$installerFile"
          mkdir -p installer/cache
          mv "installer/$installerFile" installer/cache/
          echo "installer_file=$installerFile" >> $GITHUB_OUTPUT

      - name: 缓存安装器产物（仅发布构建）
        uses: actions/upload-artifact@v7
        if: steps.check-deploy.outputs.is_deploy == 'true'
        with:
          name: installer-${{ runner.os }}-${{ github.sha }}
          path: ${{ runner.workspace }}/upstream/installer/cache/${{ steps.find_installer_file.outputs.installer_file }}

  release:
    name: 创建发布
    needs: build
    if: github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags/v') && contains(github.ref, '.')
    runs-on: ubuntu-latest
    steps:
      - name: 检出本仓库
        uses: actions/checkout@v7

      - name: 判断是否为发布构建
        id: deploy_check
        shell: bash
        run: |
          if [[ '${{ github.event.ref }}' =~ ^refs/tags/(v[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "version=${BASH_REMATCH[1]}" >> $GITHUB_OUTPUT
          else
            echo "标签不匹配：${{ github.event.ref }}"
            exit 1
          fi

      - name: 下载安装器（Windows）
        uses: actions/download-artifact@v4
        with:
          name: installer-Windows-${{ github.sha }}
          path: installer

      - name: 创建发布
        uses: ncipollo/release-action@v1
        with:
          name: Release ${{ steps.deploy_check.outputs.version }}
          draft: true
          artifacts: installer*/Birdtray-*.exe
          artifactContentType: application/x-msdownload
          artifactErrorsFailBuild: true
          generateReleaseNotes: true