name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: 'Upstream branch/tag/commit to build (default: main)'
        required: false
      upstream_repo:
        description: 'Upstream repo URL (default: https://github.com/gyunaev/birdtray.git)'
        required: false
      debug:
        description: 'Enable additional debug output (true/false)'
        required: false

env:
  DEFAULT_UPSTREAM_REPO: 'https://github.com/gyunaev/birdtray.git'
  DEFAULT_UPSTREAM_REF: 'main'

jobs:
  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest]
        qt_version: [6.8.0]
        include:
          - os: windows-latest
            qt_compile_suite: win64_msvc2022_64

    steps:
      - name: Checkout this repository (workflow + optional overrides)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Determine upstream repo/ref
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          UPSTREAM_REPO="${{ github.event.inputs.upstream_repo || env.DEFAULT_UPSTREAM_REPO }}"
          UPSTREAM_REF="${{ github.event.inputs.upstream_ref || env.DEFAULT_UPSTREAM_REF }}"
          DEBUG="${{ github.event.inputs.debug || 'false' }}"
          echo "upstream_repo=$UPSTREAM_REPO" >> $GITHUB_OUTPUT
          echo "upstream_ref=$UPSTREAM_REF" >> $GITHUB_OUTPUT
          echo "debug=$DEBUG" >> $GITHUB_OUTPUT

      - name: Install Qt ${{ matrix.qt_version }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt_version }}
          arch: ${{ matrix.qt_compile_suite }}
          cache: true
          dir: ${{ runner.temp }}/Qt

      - name: Install additional dependencies
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            sudo apt-get update -qq
            sudo apt install -qq libx11-dev libx11-xcb-dev desktop-file-utils appstream-util
          elif [ "$RUNNER_OS" == "Windows" ]; then
            choco install -y --force openssl.light --version=1.1.1
            echo "C:\Program Files\OpenSSL" >> $GITHUB_PATH
          else
            echo "$RUNNER_OS not supported"
            exit 1
          fi

      - name: Clone upstream source (gyunaev/birdtray) (robust)
        shell: bash
        run: |
          set -euo pipefail
          UPSTREAM_REPO="${{ steps.upstream.outputs.upstream_repo }}"
          UPSTREAM_REF="${{ steps.upstream.outputs.upstream_ref }}"
          echo "Requested upstream: $UPSTREAM_REPO @$UPSTREAM_REF"

          REF_TO_CLONE=""
          if git ls-remote --exit-code --heads "$UPSTREAM_REPO" "$UPSTREAM_REF" >/dev/null 2>&1 || \
             git ls-remote --exit-code --tags "$UPSTREAM_REPO" "$UPSTREAM_REF" >/dev/null 2>&1; then
            REF_TO_CLONE="$UPSTREAM_REF"
            echo "Requested ref exists on remote: $REF_TO_CLONE"
          else
            DEFAULT_BRANCH=$(git ls-remote --symref "$UPSTREAM_REPO" HEAD 2>/dev/null | awk '/^ref: refs\/heads\//{print $2}' | sed 's@refs/heads/@@' | head -n1 || true)
            if [ -n "$DEFAULT_BRANCH" ]; then
              echo "Requested ref '$UPSTREAM_REF' not found; falling back to remote default branch '$DEFAULT_BRANCH'"
              REF_TO_CLONE="$DEFAULT_BRANCH"
            else
              echo "Requested ref '$UPSTREAM_REF' not found and remote default branch could not be determined; falling back to 'master'"
              REF_TO_CLONE="master"
            fi
          fi

          echo "resolved_upstream_ref=$REF_TO_CLONE" >> $GITHUB_OUTPUT
          mkdir -p "${{ runner.workspace }}/upstream"

          if git clone --depth 1 --branch "$REF_TO_CLONE" "$UPSTREAM_REPO" "${{ runner.workspace }}/upstream"; then
            echo "Shallow clone of $REF_TO_CLONE succeeded"
          else
            echo "Shallow clone failed, performing full clone and checkout"
            rm -rf "${{ runner.workspace }}/upstream"
            git clone "$UPSTREAM_REPO" "${{ runner.workspace }}/upstream"
            cd "${{ runner.workspace }}/upstream"
            git fetch --all --tags --prune
            if git rev-parse --verify --quiet "refs/heads/$UPSTREAM_REF" >/dev/null 2>&1 || git rev-parse --verify --quiet "$UPSTREAM_REF" >/dev/null 2>&1; then
              git checkout "$UPSTREAM_REF" || true
            else
              git checkout "$REF_TO_CLONE" || true
            fi
          fi

      - name: Apply local overrides (optional)
        shell: bash
        run: |
          set -e
          if [ -d "${{ github.workspace }}/overrides" ]; then
            echo "Applying overrides from this repo to upstream..."
            cp -a "${{ github.workspace }}/overrides/." "${{ runner.workspace }}/upstream/" || true
          else
            echo "No overrides/ directory found in repo; skipping overrides."
          fi

      - name: Create build environment
        shell: bash
        run: |
          set -e
          cmake -E make_directory "${{ runner.workspace }}/build"

      - name: Show CMake version
        shell: bash
        run: cmake --version

      - name: Configure CMake (use upstream source) (tests disabled)
        shell: bash
        run: |
          set -e
          cmake -S "${{ runner.workspace }}/upstream" -B "${{ runner.workspace }}/build" \
            -DCMAKE_BUILD_TYPE=Release -DCOMPILER_WARNINGS_AS_ERRORS=ON -DBUILD_WITH_TESTS=OFF \
            -DDONT_EXECUTE_INSTALLER=ON -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Register build problem matchers (safe)
        shell: bash
        run: |
          set -euo pipefail
          for matcher in .github/problem-matchers/linguist.json .github/problem-matchers/compiler.json; do
            if [ -f "$matcher" ]; then
              echo "Adding matcher: $matcher"
              echo "::add-matcher::$matcher"
            else
              echo "Matcher not found, skipping: $matcher"
            fi
          done

      - name: Build (guarded, verbose)
        shell: bash
        run: |
          set -euo pipefail
          BUILD_DIR="${{ runner.workspace }}/build"
          if [ ! -d "$BUILD_DIR" ]; then
            echo "Build directory not found; aborting build step."
            exit 1
          fi
          cd "$BUILD_DIR"

          echo "Building birdtray (single-invocation cmake --build)..."
          if ! cmake --build . --config Release --target birdtray; then
            echo "Build FAILED. Dumping diagnostics..."
            echo "Top-level build dir listing:"
            ls -la . || true
            echo "Release dir listing:"
            ls -la Release || true
            find . -type f \( -iname "*.log" -o -iname "*.out" -o -iname "*.txt" \) -maxdepth 4 -print | while read f; do
              echo "---- tail $f ----"
              tail -n 200 "$f" || true
            done
            if [ -f CMakeFiles/CMakeOutput.log ]; then
              echo "---- CMakeOutput.log ----"
              tail -n 200 CMakeFiles/CMakeOutput.log || true
            fi
            exit 1
          fi

          echo "Build succeeded. Listing Release folder:"
          ls -la Release || true

      - name: Remove build problem matchers
        shell: bash
        run: |
          echo "::remove-matcher owner=linguist::"
          echo "::remove-matcher owner=linguist-old::"
          echo "::remove-matcher owner=compiler-gcc::"
          echo "::remove-matcher owner=compiler-msvc::"

      - name: Tests (guarded - only if tests project exists)
        shell: bash
        run: |
          set -euo pipefail
          BUILD_DIR="${{ runner.workspace }}/build"
          if [ ! -d "$BUILD_DIR" ]; then
            echo "Build directory not found; skipping tests."
            exit 0
          fi
          TEST_PROJECT=$(find "$BUILD_DIR" -maxdepth 2 -type f -iname 'tests.vcxproj' -print -quit || true)
          if [ -z "$TEST_PROJECT" ]; then
            echo "No tests project found; skipping tests."
            exit 0
          fi
          echo "Found tests project: $TEST_PROJECT"
          cd "$BUILD_DIR"
          cmake --build . --config Release --target tests && cmake --build . --config Release --target run_tests

      - name: Check if this is a deployment build
        id: check-deploy
        shell: bash
        run: |
          if [[ '${{ github.event.ref }}' =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ && "$RUNNER_OS" == "Windows" ]]; then
            echo "is_deploy=true" >> $GITHUB_OUTPUT
          else
            echo "is_deploy=false" >> $GITHUB_OUTPUT
          fi

      - name: Bundle Qt dependencies (windeployqt) on Windows (guarded)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d "${{ runner.workspace }}/build" ]; then
            echo "Build directory not found; skipping windeployqt."
            exit 0
          fi
          mkdir -p "${{ runner.workspace }}/dist"
          WINDEPLOYQT=$(command -v windeployqt || true)
          if [ -z "$WINDEPLOYQT" ]; then
            WINDEPLOYQT=$(find "${RUNNER_TEMP}/Qt" -type f -name windeployqt.exe | head -n1 || true)
          fi
          if [ -z "$WINDEPLOYQT" ]; then
            echo "windeployqt not found; ensure Qt bin is on PATH or adjust install-qt-action 'dir' setting"
            exit 1
          fi
          echo "Using windeployqt: $WINDEPLOYQT"
          "$WINDEPLOYQT" --release --dir "${{ runner.workspace }}/dist" "${{ runner.workspace }}/build/Release/birdtray.exe" || true

      - name: Install to staging dir (cmake --install) (deploy only, guarded with explicit exe check)
        if: steps.check-deploy.outputs.is_deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          BUILD_DIR="${{ runner.workspace }}/build"
          EXE_PATH="${BUILD_DIR}/Release/birdtray.exe"
          if [ ! -d "$BUILD_DIR" ]; then
            echo "Build directory not found; skipping cmake --install."
            exit 1
          fi
          if [ ! -f "$EXE_PATH" ]; then
            echo "ERROR: birdtray.exe not found at expected path: $EXE_PATH"
            echo "Build dir listing:"
            ls -la "$BUILD_DIR" || true
            echo "Release dir listing:"
            ls -la "${BUILD_DIR}/Release" || true
            if [ -f "${BUILD_DIR}/CMakeFiles/CMakeOutput.log" ]; then
              echo "---- CMakeOutput.log ----"
              tail -n 200 "${BUILD_DIR}/CMakeFiles/CMakeOutput.log" || true
            fi
            exit 1
          fi
          cd "$BUILD_DIR"
          cmake --install . --config Release --prefix "${{ runner.workspace }}/dist" || true

      - name: Prepare dist contents (move dist/bin/birdtray.exe -> dist/, collect translations)
        if: always()
        working-directory: ${{ runner.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Preparing dist contents..."
          mkdir -p "${{ runner.workspace }}/dist"
          mkdir -p "${{ runner.workspace }}/dist/translations"

          BIN_PATH="${{ runner.workspace }}/dist/bin/birdtray.exe"
          ROOT_PATH="${{ runner.workspace }}/dist/birdtray.exe"

          if [ -f "$BIN_PATH" ]; then
            echo "Moving $BIN_PATH -> $ROOT_PATH"
            mv -f "$BIN_PATH" "$ROOT_PATH" || true
            rmdir "${{ runner.workspace }}/dist/bin" 2>/dev/null || rm -rf "${{ runner.workspace }}/dist/bin" || true
          elif [ -f "$ROOT_PATH" ]; then
            echo "birdtray.exe already at $ROOT_PATH"
          else
            echo "Searching for birdtray executables in workspace..."
            FOUND=$(find "${{ runner.workspace }}" -type f -iname 'birdtray.exe' | head -n 1 || true)
            if [ -n "$FOUND" ]; then
              echo "Found: $FOUND -> moving to $ROOT_PATH"
              mv -f "$FOUND" "$ROOT_PATH" || true
              DIRNAME=$(dirname "$FOUND")
              rmdir "$DIRNAME" 2>/dev/null || true
            else
              echo "No birdtray.exe found; check build/windeployqt/install output."
            fi
          fi

          cp -r "${{ runner.workspace }}/upstream/src/res/translations/"* "${{ runner.workspace }}/dist/translations/" 2>/dev/null || true
          cp -r "${{ runner.workspace }}/upstream/src/res/locales/"* "${{ runner.workspace }}/dist/translations/" 2>/dev/null || true
          cp -r "${{ runner.workspace }}/upstream/po/"* "${{ runner.workspace }}/dist/translations/" 2>/dev/null || true
          cp -r "${{ runner.workspace }}/build/translations/"* "${{ runner.workspace }}/dist/translations/" 2>/dev/null || true

          echo "Dist contents after prepare:"
          ls -la "${{ runner.workspace }}/dist" || true
          ls -la "${{ runner.workspace }}/dist/translations" || true

      - name: (optional) Debug show build/workspace layout
        if: ${{ always() && (steps.upstream.outputs.debug == 'true') }}
        shell: bash
        run: |
          echo "Workspace: ${{ runner.workspace }}"
          echo "GitHub workspace: ${{ github.workspace }}"
          find "${{ runner.workspace }}" -maxdepth 3 -type d -print || true
          echo "build/Release listing:"
          ls -la "${{ runner.workspace }}/build" || true
          ls -la "${{ runner.workspace }}/build/Release" || true
          echo "dist listing:"
          ls -la "${{ runner.workspace }}/dist" || true

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: birdtray-${{ runner.os }}-${{ github.sha }}
          path: |
            ${{ runner.workspace }}/dist/**
            ${{ runner.workspace }}/dist/translations/**
            ${{ runner.workspace }}/build/**/*.exe
            ${{ runner.workspace }}/build/**/*.dll
            ${{ runner.workspace }}/upstream/src/res/**/locales/**
            ${{ runner.workspace }}/upstream/src/res/**/translations/**

      - name: Delete build directory (final cleanup)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "Deleting build directory (final cleanup): ${{ runner.workspace }}/build"
          rm -rf "${{ runner.workspace }}/build" || true
          echo "After deletion, workspace root listing:"
          ls -la "${{ runner.workspace }}" || true

      - name: Remove build directory (cleanup for non-deploy builds)
        if: ${{ always() && !(github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags/v')) }}
        shell: bash
        run: |
          echo "Non-deploy build: removing build directory to free space..."
          rm -rf "${{ runner.workspace }}/build" || true
          echo "After cleanup, runner workspace root:"
          ls -la "${{ runner.workspace }}" || true

      - name: Validate desktop file and app metadata (Linux only)
        working-directory: ${{ runner.workspace }}/upstream
        if: runner.os == 'Linux'
        shell: bash
        run: |
          output=$(desktop-file-validate src/res/com.ulduzsoft.Birdtray.desktop)
          if [ ! -z "$output" ]; then
            echo "$output"
            exit 1
          fi
          appstream-util validate src/res/com.ulduzsoft.Birdtray.appdata.xml

      - name: Install installer dependencies (deploy only)
        if: steps.check-deploy.outputs.is_deploy == 'true'
        run: choco install -y nsis --version=3.11

      - name: Create installer (deploy only) (guarded)
        if: steps.check-deploy.outputs.is_deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d "${{ runner.workspace }}/build" ]; then
            echo "Build directory not found; skipping installer creation."
            exit 1
          fi
          cd "${{ runner.workspace }}/build"
          cmake --build . --config Release --target install

      - name: Find installer (deploy only)
        if: steps.check-deploy.outputs.is_deploy == 'true'
        id: find_installer_file
        shell: bash
        run: |
          installerFile=$(find . -name "Birdtray-*.exe" -exec basename {} \; 2>/dev/null || true)
          echo "installer_file=$installerFile" >> $GITHUB_OUTPUT
          echo "Found installer: $installerFile"
          mkdir -p installer/cache
          mv installer/$installerFile installer/cache || true

      - name: Cache installer (deploy only)
        uses: actions/upload-artifact@v4
        if: steps.check-deploy.outputs.is_deploy == 'true'
        with:
          name: installer-${{ runner.os }}-${{ github.sha }}
          path: installer/cache/${{ steps.find_installer_file.outputs.installer_file }}

  release:
    name: Create Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags/v') && contains(github.ref, '.')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Check if this is a deployment build
        id: deploy_check
        shell: bash
        run: |
          if [[ '${{ github.event.ref }}' =~ ^refs/tags/(v[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "version=${BASH_REMATCH[1]}" >> $GITHUB_OUTPUT
          else
            echo "Tag does not match: ${{ github.event.ref }}"
            exit 1
          fi

      - name: Verify that the app metadata contains the release
        shell: bash
        run: |
          grep "version=\"${{ steps.deploy_check.outputs.version }}\"" src/res/com.ulduzsoft.Birdtray.appdata.xml -q || (echo "Version not found in src/res/com.ulduzsoft.Birdtray.appdata.xml"; exit 1)

      - name: Download installer (x64)
        uses: actions/download-artifact@v4
        with:
          name: installer-Windows-x64-${{ github.sha }}
          path: installer

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          name: Release ${{ steps.deploy_check.outputs.version }}
          draft: true
          artifacts: installer*/Birdtray-*.exe
          artifactContentType: application/x-msdownload
          artifactErrorsFailBuild: true
          generateReleaseNotes: true