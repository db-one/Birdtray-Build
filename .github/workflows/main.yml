name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: 'Upstream branch/tag/commit to build (default: main)'
        required: false
      upstream_repo:
        description: 'Upstream repo URL (default: https://github.com/gyunaev/birdtray.git)'
        required: false
      debug:
        description: 'Enable additional debug output (true/false)'
        required: false

env:
  DEFAULT_UPSTREAM_REPO: 'https://github.com/gyunaev/birdtray.git'
  DEFAULT_UPSTREAM_REF: 'main'

jobs:
  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest]
        qt_version: [6.8.0]
        include:
          - os: windows-latest
            qt_compile_suite: win64_msvc2022_64

    steps:
      - name: Checkout this repository (workflow + optional overrides)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Determine upstream repo/ref
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          UPSTREAM_REPO="${{ github.event.inputs.upstream_repo || env.DEFAULT_UPSTREAM_REPO }}"
          UPSTREAM_REF="${{ github.event.inputs.upstream_ref || env.DEFAULT_UPSTREAM_REF }}"
          DEBUG="${{ github.event.inputs.debug || 'false' }}"
          echo "upstream_repo=$UPSTREAM_REPO" >> $GITHUB_OUTPUT
          echo "upstream_ref=$UPSTREAM_REF" >> $GITHUB_OUTPUT
          echo "debug=$DEBUG" >> $GITHUB_OUTPUT

      - name: Install Qt ${{ matrix.qt_version }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt_version }}
          arch: ${{ matrix.qt_compile_suite }}
          cache: true
          dir: ${{ runner.temp }}/Qt

      - name: Install additional dependencies
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            sudo apt-get update -qq
            sudo apt install -qq libx11-dev libx11-xcb-dev desktop-file-utils appstream-util
          elif [ "$RUNNER_OS" == "Windows" ]; then
            choco install -y --force openssl.light --version=1.1.1
            echo "C:\\Program Files\\OpenSSL" >> $GITHUB_PATH
          else
            echo "$RUNNER_OS not supported"
            exit 1
          fi

      - name: Clone upstream source (gyunaev/birdtray)
        shell: bash
        run: |
          set -euo pipefail
          WORKSPACE="${{ runner.workspace }}"
          UPSTREAM_REPO="${{ steps.upstream.outputs.upstream_repo }}"
          UPSTREAM_REF="${{ steps.upstream.outputs.upstream_ref }}"
          echo "Cloning $UPSTREAM_REPO @$UPSTREAM_REF into $WORKSPACE/upstream"
          mkdir -p "$WORKSPACE/upstream"
          git clone --depth 1 --branch "$UPSTREAM_REF" "$UPSTREAM_REPO" "$WORKSPACE/upstream" || \
            (echo "Shallow clone failed, trying full clone and checkout"; rm -rf "$WORKSPACE/upstream"; git clone "$UPSTREAM_REPO" "$WORKSPACE/upstream"; cd "$WORKSPACE/upstream"; git fetch --all; git checkout "$UPSTREAM_REF")

      - name: Apply local overrides (optional)
        shell: bash
        run: |
          set -euo pipefail
          WORKSPACE="${{ runner.workspace }}"
          if [ -d "${{ github.workspace }}/overrides" ]; then
            echo "Applying overrides from this repo to upstream..."
            cp -a "${{ github.workspace }}/overrides/." "$WORKSPACE/upstream/" || true
          else
            echo "No overrides/ directory found in repo; skipping overrides."
          fi

      - name: Create build environment
        run: cmake -E make_directory ${{ runner.workspace }}/build

      - name: Configure CMake (use upstream source)
        shell: bash
        run: |
          set -euo pipefail
          WORKSPACE="${{ runner.workspace }}"
          cmake -S "$WORKSPACE/upstream" -B "$WORKSPACE/build" \
            -DCMAKE_BUILD_TYPE=Release -DCOMPILER_WARNINGS_AS_ERRORS=ON -DBUILD_WITH_TESTS=ON \
            -DDONT_EXECUTE_INSTALLER=ON -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Register build problem matchers
        run: |
          echo "::add-matcher::.github/problem-matchers/linguist.json"
          echo "::add-matcher::.github/problem-matchers/compiler.json"

      - name: Build
        working-directory: ${{ runner.workspace }}/build
        run: cmake --build . --config Release --target birdtray

      - name: Remove build problem matchers
        run: |
          echo "::remove-matcher owner=linguist::"
          echo "::remove-matcher owner=linguist-old::"
          echo "::remove-matcher owner=compiler-gcc::"
          echo "::remove-matcher owner=compiler-msvc::"

      - name: Tests
        working-directory: ${{ runner.workspace }}/build
        run: cmake --build . --config Release --target tests && cmake --build . --config Release --target run_tests

      - name: Bundle Qt dependencies (windeployqt) on Windows
        if: runner.os == 'Windows'
        working-directory: ${{ runner.workspace }}/build
        shell: bash
        run: |
          set -euo pipefail
          WORKSPACE="${{ runner.workspace }}"
          mkdir -p "$WORKSPACE/dist"
          WINDEPLOYQT=$(command -v windeployqt || true)
          if [ -z "$WINDEPLOYQT" ]; then
            WINDEPLOYQT=$(find "${RUNNER_TEMP}/Qt" -type f -name windeployqt.exe | head -n1 || true)
          fi
          if [ -z "$WINDEPLOYQT" ]; then
            echo "windeployqt not found; ensure Qt bin is on PATH or adjust install-qt-action 'dir' setting"
            exit 1
          fi
          echo "Using windeployqt: $WINDEPLOYQT"
          "$WINDEPLOYQT" --release --dir "$WORKSPACE/dist" "$WORKSPACE/build/Release/birdtray.exe" || true

      - name: Install to staging dir (cmake --install)
        if: always()
        working-directory: ${{ runner.workspace }}/build
        shell: bash
        run: |
          set -euo pipefail
          WORKSPACE="${{ runner.workspace }}"
          cmake --install . --config Release --prefix "$WORKSPACE/dist" || true

      - name: Prepare dist contents (move dist/bin/birdtray.exe -> dist/, collect translations)
        if: always()
        working-directory: ${{ runner.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          WORKSPACE="${{ runner.workspace }}"
          echo "Preparing dist contents..."
          mkdir -p "$WORKSPACE/dist"
          mkdir -p "$WORKSPACE/dist/translations"

          BIN_PATH="$WORKSPACE/dist/bin/birdtray.exe"
          ROOT_PATH="$WORKSPACE/dist/birdtray.exe"

          if [ -f "$BIN_PATH" ]; then
            echo "Moving $BIN_PATH -> $ROOT_PATH"
            mv -f "$BIN_PATH" "$ROOT_PATH" || true
            rmdir "$WORKSPACE/dist/bin" 2>/dev/null || rm -rf "$WORKSPACE/dist/bin" || true
          elif [ -f "$ROOT_PATH" ]; then
            echo "birdtray.exe already at $ROOT_PATH"
          else
            echo "Searching for birdtray executables in workspace..."
            FOUND=$(find "$WORKSPACE" -type f -iname 'birdtray.exe' | head -n 1 || true)
            if [ -n "$FOUND" ]; then
              echo "Found: $FOUND -> moving to $ROOT_PATH"
              mv -f "$FOUND" "$ROOT_PATH" || true
              DIRNAME=$(dirname "$FOUND")
              rmdir "$DIRNAME" 2>/dev/null || true
            else
              echo "No birdtray.exe found; check build/windeployqt/install output."
            fi
          fi

          cp -r "$WORKSPACE/upstream/src/res/translations/"* "$WORKSPACE/dist/translations/" 2>/dev/null || true
          cp -r "$WORKSPACE/upstream/src/res/locales/"* "$WORKSPACE/dist/translations/" 2>/dev/null || true
          cp -r "$WORKSPACE/upstream/po/"* "$WORKSPACE/dist/translations/" 2>/dev/null || true
          cp -r "$WORKSPACE/build/translations/"* "$WORKSPACE/dist/translations/" 2>/dev/null || true

          echo "Dist contents after prepare:"
          ls -la "$WORKSPACE/dist" || true
          ls -la "$WORKSPACE/dist/translations" || true

      - name: (optional) Debug: show build/workspace layout
        if: ${{ always() && steps.upstream.outputs.debug == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          WORKSPACE="${{ runner.workspace }}"
          echo "Workspace: $WORKSPACE"
          echo "GitHub workspace: ${{ github.workspace }}"
          find "$WORKSPACE" -maxdepth 3 -type d -print || true
          echo "build/Release listing:"
          ls -la "$WORKSPACE/build" || true
          ls -la "$WORKSPACE/build/Release" || true
          echo "dist listing:"
          ls -la "$WORKSPACE/dist" || true

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: birdtray-${{ runner.os }}-${{ github.sha }}
          path: |
            ${{ runner.workspace }}/dist/**
            ${{ runner.workspace }}/dist/translations/**
            ${{ runner.workspace }}/build/**/*.exe
            ${{ runner.workspace }}/build/**/*.dll
            ${{ runner.workspace }}/upstream/src/res/**/locales/**
            ${{ runner.workspace }}/upstream/src/res/**/translations/**

      - name: Remove build directory (cleanup for non-deploy builds)
        if: ${{ always() && !(github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags/v')) }}
        shell: bash
        run: |
          set -euo pipefail
          WORKSPACE="${{ runner.workspace }}"
          echo "Non-deploy build: removing build directory to free space..."
          rm -rf "$WORKSPACE/build" || true
          echo "After cleanup, runner workspace root:"
          ls -la "$WORKSPACE" || true

      - name: Validate desktop file and app metadata (Linux only)
        working-directory: ${{ runner.workspace }}/upstream
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          output=$(desktop-file-validate src/res/com.ulduzsoft.Birdtray.desktop)
          if [ ! -z "$output" ]; then
            echo "$output"
            exit 1
          fi
          appstream-util validate src/res/com.ulduzsoft.Birdtray.appdata.xml

      - name: Check if this is a deployment build
        id: check-deploy
        shell: bash
        run: |
          set -euo pipefail
          if [[ '${{ github.event.ref }}' =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ && "$RUNNER_OS" == "Windows" ]]; then
            echo "is_deploy=true" >> $GITHUB_OUTPUT
          else
            echo "is_deploy=false" >> $GITHUB_OUTPUT
          fi

      - name: Install installer dependencies (deploy only)
        if: steps.check-deploy.outputs.is_deploy == 'true'
        run: choco install -y nsis --version=3.11

      - name: Create installer (deploy only)
        if: steps.check-deploy.outputs.is_deploy == 'true'
        working-directory: ${{ runner.workspace }}/build
        run: cmake --build . --config Release --target install

      - name: Find installer (deploy only)
        if: steps.check-deploy.outputs.is_deploy == 'true'
        id: find_installer_file
        shell: bash
        run: |
          set -euo pipefail
          WORKSPACE="${{ runner.workspace }}"
          installerFile=$(find "$WORKSPACE" -name "Birdtray-*.exe" -exec basename {} \; | head -n 1 || true)
          echo "installer_file=$installerFile" >> $GITHUB_OUTPUT
          echo "Found installer: $installerFile"
          mkdir -p installer/cache
          mv installer/"$installerFile" installer/cache || true

      - name: Cache installer (deploy only)
        uses: actions/upload-artifact@v4
        if: steps.find_installer_file.outputs.installer_file != ''
        with:
          name: installer-${{ runner.os }}-${{ github.sha }}
          path: installer/cache/${{ steps.find_installer_file.outputs.installer_file }}

  release:
    name: Create Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags/v') && contains(github.ref, '.')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Check if this is a deployment build
        id: deploy_check
        shell: bash
        run: |
          set -euo pipefail
          if [[ '${{ github.event.ref }}' =~ ^refs/tags/(v[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "version=${BASH_REMATCH[1]}" >> $GITHUB_OUTPUT
          else
            echo "Tag does not match: ${{ github.event.ref }}"
            exit 1
          fi

      - name: Verify that the app metadata contains the release
        shell: bash
        run: |
          set -euo pipefail
          grep "version=\"${{ steps.deploy_check.outputs.version }}\"" src/res/com.ulduzsoft.Birdtray.appdata.xml -q || (echo "Version not found in src/res/com.ulduzsoft.Birdtray.appdata.xml"; exit 1)

      - name: Download installer (x64)
        uses: actions/download-artifact@v4
        with:
          name: installer-Windows-x64-${{ github.sha }}
          path: installer

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          name: Release ${{ steps.deploy_check.outputs.version }}
          draft: true
          artifacts: installer*/Birdtray-*.exe
          artifactContentType: application/x-msdownload
          artifactErrorsFailBuild: true
          generateReleaseNotes: true
